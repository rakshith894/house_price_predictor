{% extends 'base.html' %}
{% block title %}House Price Predictor{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-3">Predict House Price</h2>
          <p class="text-muted">Enter the property details below and get an instant estimate.</p>

          <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6">
                <label for="area" class="form-label">Area (sq ft)</label>
                <input id="area" name="area" type="number" step="0.01" class="form-control" placeholder="e.g. 1500" required>
              </div>
              <div class="col-md-6">
                <label for="bedrooms" class="form-label">Bedrooms</label>
                <input id="bedrooms" name="bedrooms" type="number" class="form-control" placeholder="e.g. 3" required>
              </div>
              <div class="col-md-6">
                <label for="bathrooms" class="form-label">Bathrooms</label>
                <input id="bathrooms" name="bathrooms" type="number" class="form-control" placeholder="e.g. 2" required>
              </div>
              <div class="col-md-6">
                <label for="age" class="form-label">Age of property (years)</label>
                <input id="age" name="age" type="number" class="form-control" placeholder="e.g. 5" required>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
              <button type="submit" class="btn btn-primary btn-lg">Predict Price</button>
              <a class="btn btn-outline-secondary" href="/admin/">Admin</a>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center mt-4 text-muted small">
        Built with Django • Simple demo predictor
      </div>
    </div>
  </div>
</div>
{% endblock %}
