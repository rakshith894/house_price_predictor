services:
  - type: web
    name: house-price-predictor
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn mlproject.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: house-price-predictor-db
          property: connectionString

  - type: postgres
    name: house-price-predictor-db
    plan: free
    ipAllowList: []
